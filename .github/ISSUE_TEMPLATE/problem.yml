name: Something is not working
description: Help us fix an installation or app problem.
body:
  - type: markdown
    attributes:
      value: "Please do not paste API keys or private questions. Try the Start Here guide and troubleshooting first."
  - type: input
    id: computer
    attributes:
      label: What computer are you using?
      placeholder: "For example: Windows 11 Intel laptop, or macOS 15 M2 MacBook"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Which app release did you download?
      placeholder: "For example: 2.2.0; the number is on the download page"
  - type: textarea
    id: steps
    attributes:
      label: What did you click, and what happened?
      description: Include the error wording and which provider failed, if relevant. Never include a key.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
