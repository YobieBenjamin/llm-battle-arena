name: Weekly live provider check
on:
  schedule:
    - cron: '23 16 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.keys.outputs.configured }}
    steps:
      - id: keys
        name: Report whether any live checks are configured
        env:
          CLAUDE_KEY: ${{ secrets.ARENA_LIVE_CLAUDE_KEY }}
          OPENAI_KEY: ${{ secrets.ARENA_LIVE_OPENAI_KEY }}
          GEMINI_KEY: ${{ secrets.ARENA_LIVE_GEMINI_KEY }}
        shell: bash
        run: |
          if [[ -n "$CLAUDE_KEY" || -n "$OPENAI_KEY" || -n "$GEMINI_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Live provider check SKIPPED: no dedicated keys configured. Provider health was not tested." >> "$GITHUB_STEP_SUMMARY"
          fi
  live:
    needs: configuration
    if: needs.configuration.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Small paid calls only for configured dedicated secrets
        env:
          ARENA_LIVE_CLAUDE_KEY: ${{ secrets.ARENA_LIVE_CLAUDE_KEY }}
          ARENA_LIVE_OPENAI_KEY: ${{ secrets.ARENA_LIVE_OPENAI_KEY }}
          ARENA_LIVE_GEMINI_KEY: ${{ secrets.ARENA_LIVE_GEMINI_KEY }}
          ARENA_LIVE_CLAUDE_MODEL: ${{ vars.ARENA_LIVE_CLAUDE_MODEL }}
          ARENA_LIVE_OPENAI_MODEL: ${{ vars.ARENA_LIVE_OPENAI_MODEL }}
          ARENA_LIVE_GEMINI_MODEL: ${{ vars.ARENA_LIVE_GEMINI_MODEL }}
        run: node scripts/live-check.mjs
