name: Desktop installers
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, platform: win, arch: x64}
          - {os: windows-11-arm, platform: win, arch: arm64}
          - {os: macos-15, platform: mac, arch: arm64}
          - {os: macos-15-intel, platform: mac, arch: x64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build private regression application (never uploaded)
        run: npm exec electron-builder -- --${{ matrix.platform }} --${{ matrix.arch }} --dir --publish never -c.directories.output=dist/private -c.electronFuses.enableNodeCliInspectArguments=true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Deep regressions on private build
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            private="dist/private/mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}/LLM Battle Arena.app"
            executable="$private/Contents/MacOS/LLM Battle Arena"
          else
            private="dist/private/win${{ matrix.arch == 'arm64' && '-arm64' || '' }}-unpacked/LLM Battle Arena.exe"
            executable="$private"
          fi
          node scripts/verify-bundle.cjs "$private" --private-test-build
          ARENA_ELECTRON_PATH="$PWD/$executable" npm run test:ui
      - name: Build hardened release
        run: npm exec electron-builder -- --${{ matrix.platform }} --${{ matrix.arch }} --publish never -c.directories.output=dist/release
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify and test exact release through UI
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            relative="mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}/LLM Battle Arena.app"
            codesign --verify --deep --strict "dist/release/$relative"
          else
            relative="win${{ matrix.arch == 'arm64' && '-arm64' || '' }}-unpacked/LLM Battle Arena.exe"
          fi
          node scripts/compare-builds.cjs "dist/private/$relative" "dist/release/$relative"
          node scripts/verify-bundle.cjs "dist/release/$relative"
          ARENA_RELEASE_REPORT="dist/release/proof-${{ matrix.platform }}-${{ matrix.arch }}.json" node scripts/release-smoke.cjs "dist/release/$relative"
      - name: Test installer payloads
        shell: bash
        run: |
          for installer in dist/release/*.${{ matrix.platform == 'mac' && 'dmg' || 'exe' }}; do
            node scripts/verify-installer.cjs "$installer" "dist/release/proof-${{ matrix.platform }}-${{ matrix.arch }}.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/release/*.exe
            dist/release/*.dmg
            dist/release/proof-*.json
          if-no-files-found: error
  ui:
    name: Electron UI regressions
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install-deps chromium
      - run: xvfb-run --auto-servernum --server-args="-screen 0 1600x1200x24" npm run test:ui
  release:
    name: Publish downloads
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, ui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum *.dmg *.exe proof-*.json > SHA256SUMS.txt
      - name: Publish public release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --title "LLM Battle Arena $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
  verify-public:
    name: Verify public release downloads
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download public release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release download "$RELEASE_TAG" --repo YobieBenjamin/llm-battle-arena --dir verify-release
      - name: Verify all checksums, both Mac signatures and bundled code
        run: node scripts/verify-release.cjs verify-release

  verify-public-ui:
    name: Public installer UI (${{ matrix.platform }}-${{ matrix.arch }})
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, platform: win, arch: x64, pattern: '*Windows-x64*'}
          - {os: windows-11-arm, platform: win, arch: arm64, pattern: '*Windows-arm64*'}
          - {os: macos-15, platform: mac, arch: arm64, pattern: '*macOS-arm64*'}
          - {os: macos-15-intel, platform: mac, arch: x64, pattern: '*macOS-x64*'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download published installers and proof
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release download "$RELEASE_TAG" --repo YobieBenjamin/llm-battle-arena --dir verify-ui --pattern '${{ matrix.pattern }}' --pattern 'proof-${{ matrix.platform }}-${{ matrix.arch }}.json' --pattern SHA256SUMS.txt
      - name: Check public bytes and run hardened UI
        shell: bash
        run: |
          node scripts/check-downloads.cjs verify-ui
          for installer in verify-ui/*.${{ matrix.platform == 'mac' && 'dmg' || 'exe' }}; do
            node scripts/verify-installer.cjs "$installer" "verify-ui/proof-${{ matrix.platform }}-${{ matrix.arch }}.json"
          done
