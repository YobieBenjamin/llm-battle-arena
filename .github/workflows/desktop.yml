name: Desktop installers
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, platform: win, arch: x64}
          - {os: windows-latest, platform: win, arch: arm64}
          - {os: macos-latest, platform: mac, arch: arm64}
          - {os: macos-latest, platform: mac, arch: x64}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm exec electron-builder -- --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify sealed Mac bundle
        if: matrix.platform == 'mac'
        run: codesign --verify --deep --strict --verbose=2 "dist/mac${{ matrix.arch == 'arm64' && '-arm64' || '' }}/LLM Battle Arena.app"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error
  ui:
    name: Electron UI regressions
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install-deps chromium
      - run: xvfb-run --auto-servernum npm run test:ui
  release:
    name: Publish downloads
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, ui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum *.dmg *.exe > SHA256SUMS.txt
      - name: Publish public release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --title "LLM Battle Arena $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
